name: Caroline Phone Edge

on:
  push:
    branches:
      - refactor/cloudflare-phone-edge
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        working-directory: cloudflare/caroline_phone
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Typecheck and tests
        working-directory: cloudflare/caroline_phone
        run: npm run check
