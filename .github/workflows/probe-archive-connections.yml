name: Probe archive connections

on:
  push:
    branches:
      - archive/legacy-supabase-r2-extractor
    paths:
      - '.github/workflows/probe-archive-connections.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      STORE_ID: 9be81e9381ec458ca5bcb276979ce513
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Report secret presence only
        shell: bash
        run: |
          set -eu
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID SUPABASE_DB_URL SUPABASE_ACCESS_TOKEN R2_ENDPOINT_URL R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY; do
            if [ -n "${!name:-}" ]; then
              echo "$name=present"
            else
              echo "$name=absent"
            fi
          done

      - name: Install Wrangler
        working-directory: cloudflare
        run: npm install --no-audit --no-fund

      - name: Cloudflare identity
        working-directory: cloudflare
        shell: bash
        run: |
          set +e
          npx wrangler whoami
          echo "whoami_exit=$?"
          exit 0

      - name: List R2 buckets
        working-directory: cloudflare
        shell: bash
        run: |
          set +e
          npx wrangler r2 bucket list
          echo "r2_list_exit=$?"
          exit 0

      - name: List Secrets Store metadata only
        working-directory: cloudflare
        shell: bash
        run: |
          set +e
          npx wrangler secrets-store secret list "$STORE_ID" --remote --per-page 100
          echo "secrets_store_list_exit=$?"
          exit 0

      - name: Probe existing Worker health
        shell: bash
        run: |
          set +e
          curl --fail --silent --show-error --max-time 20 https://caroline-event-worker.customerservice-882.workers.dev/health
          echo
          echo "worker_health_exit=$?"
          exit 0
