name: Import Caroline baseline
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Expand baseline
        shell: bash
        run: |
          cat bootstrap/part-* > /tmp/caroline-ai-baseline.tar.gz.b64
          base64 --decode /tmp/caroline-ai-baseline.tar.gz.b64 > /tmp/caroline-ai-baseline.tar.gz
          tar -xzf /tmp/caroline-ai-baseline.tar.gz -C .
          rm -rf bootstrap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Baseline import from live ElevenLabs and Supabase"
          git push
