name: Inspect Cloudflare Secrets Store metadata

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-cloudflare-secret-store.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: List Cloudflare Secrets Store metadata only
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: secrets-store secret list 9be81e9381ec458ca5bcb276979ce513 --remote --per-page 100
