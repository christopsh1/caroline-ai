name: Provision Caroline Cloudflare Queues After Transfer

on:
  workflow_dispatch:

jobs:
  provision:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Verify Cloudflare auth safely
        shell: bash
        run: |
          set -euo pipefail
          token="${CLOUDFLARE_API_TOKEN//$'\r'/}"
          token="${token//$'\n'/}"
          account="${CLOUDFLARE_ACCOUNT_ID//$'\r'/}"
          account="${account//$'\n'/}"
          if [[ -z "$token" || -z "$account" ]]; then
            echo "Required Cloudflare secret is empty."
            exit 1
          fi
          auth="Authorization: Bearer ${token}"
          user_status="$(curl --silent --show-error -o /tmp/cf-user-verify.json -w '%{http_code}' -H "$auth" 'https://api.cloudflare.com/client/v4/user/tokens/verify')"
          echo "user_token_verify_http=${user_status}"
          jq -c '{success, result_status: .result.status, errors: [.errors[]? | {code,message}]}' /tmp/cf-user-verify.json || true
          account_status="$(curl --silent --show-error -o /tmp/cf-account-verify.json -w '%{http_code}' -H "$auth" "https://api.cloudflare.com/client/v4/accounts/${account}/tokens/verify")"
          echo "account_token_verify_http=${account_status}"
          jq -c '{success, result_status: .result.status, errors: [.errors[]? | {code,message}]}' /tmp/cf-account-verify.json || true
          if [[ "$user_status" != "200" && "$account_status" != "200" ]]; then
            echo "Cloudflare rejected the supplied token before Queue access was attempted."
            exit 1
          fi

      - name: Create or verify Caroline queues
        shell: bash
        run: |
          set -euo pipefail
          token="${CLOUDFLARE_API_TOKEN//$'\r'/}"
          token="${token//$'\n'/}"
          account="${CLOUDFLARE_ACCOUNT_ID//$'\r'/}"
          account="${account//$'\n'/}"
          auth="Authorization: Bearer ${token}"
          api="https://api.cloudflare.com/client/v4/accounts/${account}/queues"
          list_status="$(curl --silent --show-error -o /tmp/cf-queues.json -w '%{http_code}' -H "$auth" "$api")"
          echo "queues_list_http=${list_status}"
          if [[ "$list_status" != "200" ]]; then
            jq -c '{success, errors: [.errors[]? | {code,message}]}' /tmp/cf-queues.json || true
            exit 1
          fi
          ensure_queue() {
            name="$1"
            if jq -e --arg name "$name" '.result[]? | select(.queue_name == $name)' /tmp/cf-queues.json >/dev/null; then
              echo "Queue already exists: $name"
              return
            fi
            create_status="$(curl --silent --show-error -o "/tmp/${name}.json" -w '%{http_code}' -X POST -H "$auth" -H 'Content-Type: application/json' --data "$(jq -nc --arg name "$name" '{queue_name:$name}')" "$api")"
            echo "create_${name}_http=${create_status}"
            if [[ "$create_status" != "200" && "$create_status" != "201" ]]; then
              jq -c '{success, errors: [.errors[]? | {code,message}]}' "/tmp/${name}.json" || true
              exit 1
            fi
            echo "Created queue: $name"
          }
          ensure_queue caroline-event-delivery
          ensure_queue caroline-event-dlq
          final_status="$(curl --silent --show-error -o /tmp/cf-queues-final.json -w '%{http_code}' -H "$auth" "$api")"
          [[ "$final_status" == "200" ]]
          jq -e '.result[]? | select(.queue_name == "caroline-event-delivery")' /tmp/cf-queues-final.json >/dev/null
          jq -e '.result[]? | select(.queue_name == "caroline-event-dlq")' /tmp/cf-queues-final.json >/dev/null
          echo "Verified both Caroline queues in Cloudflare."
