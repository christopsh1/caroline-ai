name: Provision Caroline Cloudflare Queues

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/provision-caroline-queues.yml
  workflow_dispatch:

permissions: write-all

# retrigger after repository Actions settings update
jobs:
  provision:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Create or verify Caroline queues
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/queues"
          auth="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"

          ensure_queue() {
            name="$1"
            response="$(curl --silent --show-error --fail-with-body -H "$auth" "$api")"
            if printf '%s' "$response" | jq -e --arg name "$name" '.result[]? | select(.queue_name == $name)' >/dev/null; then
              echo "Queue already exists: $name"
              return
            fi
            curl --silent --show-error --fail-with-body \
              -X POST \
              -H "$auth" \
              -H 'Content-Type: application/json' \
              --data "$(jq -nc --arg name "$name" '{queue_name:$name}')" \
              "$api" | jq -e '.success == true' >/dev/null
            echo "Created queue: $name"
          }

          ensure_queue caroline-event-delivery
          ensure_queue caroline-event-dlq

          final="$(curl --silent --show-error --fail-with-body -H "$auth" "$api")"
          printf '%s' "$final" | jq -e '.result[]? | select(.queue_name == "caroline-event-delivery")' >/dev/null
          printf '%s' "$final" | jq -e '.result[]? | select(.queue_name == "caroline-event-dlq")' >/dev/null
          echo "Verified both Caroline queues in Cloudflare."
