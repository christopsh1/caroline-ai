name: Deploy caroline-mcp

on:
  pull_request:
    branches: [main]
    paths:
      - 'services/caroline-mcp/**'
      - '.github/workflows/deploy-caroline-mcp.yml'
  push:
    branches: [main]
    paths:
      - 'services/caroline-mcp/**'
      - '.github/workflows/deploy-caroline-mcp.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: services/caroline-mcp
        run: npm install --no-audit --no-fund

      - name: Validate Worker bundle
        working-directory: services/caroline-mcp
        run: npm run check

  deploy:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Load deployment credentials from Infisical
        uses: Infisical/secrets-action@v1.0.17
        with:
          method: oidc
          identity-id: ${{ vars.INFISICAL_IDENTITY_ID }}
          project-slug: ${{ vars.INFISICAL_PROJECT_SLUG }}
          env-slug: ${{ vars.INFISICAL_ENV_SLUG }}
          secret-path: ${{ vars.INFISICAL_SECRET_PATH }}
          domain: https://app.infisical.com

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: services/caroline-mcp
        run: npm install --no-audit --no-fund

      - name: Deploy to Cloudflare
        working-directory: services/caroline-mcp
        run: npx wrangler deploy
