name: Deploy caroline-mcp

on:
  pull_request:
    branches: [main]
    paths:
      - 'services/caroline-mcp/**'
      - '.github/workflows/deploy-caroline-mcp.yml'
  push:
    branches: [main]
    paths:
      - 'services/caroline-mcp/**'
      - '.github/workflows/deploy-caroline-mcp.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        working-directory: services/caroline-mcp
        run: npm install --no-audit --no-fund

      - name: Validate Worker bundle
        working-directory: services/caroline-mcp
        run: npm run check

  deploy:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        working-directory: services/caroline-mcp
        run: npm install --no-audit --no-fund

      - name: Bootstrap Caroline MCP credentials
        working-directory: services/caroline-mcp
        env:
          GITHUB_FALLBACK_CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GITHUB_FALLBACK_CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MCP_GATEWAY_TOKEN: ${{ secrets.MCP_GATEWAY_TOKEN }}
        run: node scripts/bootstrap-ci.mjs

      - name: Deploy caroline-mcp code
        working-directory: services/caroline-mcp
        run: npx wrangler deploy

      - name: Provision caroline-mcp runtime secrets
        working-directory: services/caroline-mcp
        run: node scripts/runtime-secrets-json.mjs | npx wrangler secret bulk

      - name: Verify live Caroline MCP health
        shell: bash
        run: |
          set -euo pipefail
          health_file="$(mktemp)"
          curl --fail --silent --show-error --retry 8 --retry-delay 2 \
            https://caroline-mcp.customerservice-882.workers.dev/health \
            > "$health_file"
          node - "$health_file" <<'NODE'
          const fs = require('fs');
          const path = process.argv[2];
          const health = JSON.parse(fs.readFileSync(path, 'utf8'));
          if (health.service !== 'caroline-mcp') throw new Error('unexpected service');
          if (health.gateway_locked !== false) throw new Error('MCP gateway is locked');
          if (health.workers_control_configured !== true) throw new Error('Workers control is not configured');
          if (health.workers_builds_configured !== true) throw new Error('Workers Builds is not configured');
          console.log(`caroline-mcp live health verified: version=${health.version}, environment=${health.environment}`);
          NODE
