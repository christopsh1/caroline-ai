name: Provision caroline-mcp runtime secrets

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  provision:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: services/caroline-mcp
        run: npm install --no-audit --no-fund

      - name: Verify dedicated runtime secrets are present
        shell: bash
        env:
          MCP_GATEWAY_TOKEN: ${{ secrets.MCP_GATEWAY_TOKEN }}
          CLOUDFLARE_CONTROL_TOKEN: ${{ secrets.CLOUDFLARE_CONTROL_TOKEN }}
          CLOUDFLARE_BUILDS_TOKEN: ${{ secrets.CLOUDFLARE_BUILDS_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$MCP_GATEWAY_TOKEN" || { echo "MCP_GATEWAY_TOKEN is missing"; exit 1; }
          test -n "$CLOUDFLARE_CONTROL_TOKEN" || { echo "CLOUDFLARE_CONTROL_TOKEN is missing"; exit 1; }
          test -n "$CLOUDFLARE_BUILDS_TOKEN" || { echo "CLOUDFLARE_BUILDS_TOKEN is missing"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "CLOUDFLARE_ACCOUNT_ID is missing"; exit 1; }

      - name: Provision runtime secrets to caroline-mcp
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: services/caroline-mcp
          command: deploy
          secrets: |
            MCP_GATEWAY_TOKEN
            CLOUDFLARE_CONTROL_TOKEN
            CLOUDFLARE_BUILDS_TOKEN
            CLOUDFLARE_ACCOUNT_ID
        env:
          MCP_GATEWAY_TOKEN: ${{ secrets.MCP_GATEWAY_TOKEN }}
          CLOUDFLARE_CONTROL_TOKEN: ${{ secrets.CLOUDFLARE_CONTROL_TOKEN }}
          CLOUDFLARE_BUILDS_TOKEN: ${{ secrets.CLOUDFLARE_BUILDS_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
