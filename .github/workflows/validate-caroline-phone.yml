name: Validate caroline-phone

on:
  pull_request:
    paths:
      - 'cloudflare/caroline_phone/**'
      - '.github/workflows/validate-caroline-phone.yml'
  push:
    branches:
      - main
      - 'voice/phone-architecture-correction'
      - 'voice/phone-architecture-correction-v2'
    paths:
      - 'cloudflare/caroline_phone/**'
      - '.github/workflows/validate-caroline-phone.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        working-directory: cloudflare/caroline_phone
        run: npm install --no-audit --no-fund

      - name: Typecheck and synthetic tests
        working-directory: cloudflare/caroline_phone
        run: npm run check

      - name: Validate Wrangler bundle
        working-directory: cloudflare/caroline_phone
        run: npx wrangler deploy --dry-run --outdir .wrangler-dry-run
