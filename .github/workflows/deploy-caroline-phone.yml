name: Deploy caroline-phone

on:
  push:
    branches: [main]
    paths:
      - 'cloudflare/caroline_phone/**'
      - '.github/workflows/deploy-caroline-phone.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        working-directory: cloudflare/caroline_phone
        run: npm install --no-audit --no-fund

      - name: Validate phone Worker
        working-directory: cloudflare/caroline_phone
        run: npm run check

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloudflare/caroline_phone
          command: deploy
