name: Deploy caroline-phone

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'cloudflare/caroline_phone/**'
      - '.github/workflows/deploy-caroline-phone.yml'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        working-directory: cloudflare/caroline_phone
        run: npm install --no-audit --no-fund

      - name: Validate before deploy
        working-directory: cloudflare/caroline_phone
        run: npm run check

      - name: Deploy caroline-phone without replacing runtime secrets
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloudflare/caroline_phone
          command: deploy

      - name: Inspect runtime secret names
        working-directory: cloudflare/caroline_phone
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler secret list

      - name: Verify live phone runtime readiness
        shell: bash
        run: |
          set -euo pipefail
          health_file="$(mktemp)"
          curl --fail --silent --show-error --retry 12 --retry-delay 2 --retry-all-errors \
            https://caroline-phone.customerservice-882.workers.dev/health \
            > "$health_file"
          node - "$health_file" <<'NODE'
          const fs = require('fs');
          const health = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          if (health.service !== 'caroline-phone') throw new Error('unexpected service');
          if (health.inbound_agent_configured !== true) throw new Error('inbound ElevenLabs runtime not configured');
          if (health.outbound_agent_configured !== true) throw new Error('outbound ElevenLabs runtime not configured');
          console.log(`caroline-phone deployed: elevenlabs_secret=${health.elevenlabs_secret_configured}, twilio_secret=${health.twilio_secret_configured}`);
          NODE
