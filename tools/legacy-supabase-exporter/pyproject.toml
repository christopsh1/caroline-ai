[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "caroline-legacy-archive"
version = "0.1.0"
description = "Fail-closed exporter for approved non-RAG legacy Caroline Supabase material"
requires-python = ">=3.11"
dependencies = [
  "boto3>=1.35,<2",
  "botocore>=1.35,<2",
  "jsonschema>=4.23,<5",
  "psycopg[binary]>=3.2,<4",
]

[project.optional-dependencies]
parquet = ["pyarrow>=17,<24"]
dev = ["pytest>=8,<9"]

[project.scripts]
caroline-archive = "caroline_archive.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.package-data]
caroline_archive = ["schemas/*.json"]
