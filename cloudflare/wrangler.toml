name = "caroline-event-worker"
main = "src/index.js"
compatibility_date = "2026-09-23"
account_id = "882fc7501e4632c7c58879d5c1d5b672"
workers_dev = true

[observability]
enabled = true

[vars]
WORKER_NAME = "caroline-event-worker"

[[kv_namespaces]]
binding = "CAROLINE_PHONE"
id = "85679a0030e846ee931226aa1a6e6332"

[[r2_buckets]]
binding = "CAROLINE_EVENTS_RAW"
bucket_name = "caroline-events-raw"

[[r2_buckets]]
binding = "CAROLINE_TRANSCRIPTS"
bucket_name = "caroline-transcripts"

[[r2_buckets]]
binding = "CAROLINE_ARTIFACTS"
bucket_name = "caroline-artifacts"

[[r2_buckets]]
binding = "CAROLINE_MEDIA"
bucket_name = "caroline-media"

[[d1_databases]]
binding = "CAROLINE_DB"
database_name = "CAROLINE_DB"
database_id = "e350a176-c2be-4b5c-9975-bebb157e944a"

[[queues.producers]]
binding = "EVENT_DELIVERY"
queue = "caroline-event-delivery"

[[queues.consumers]]
queue = "caroline-event-delivery"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 3
