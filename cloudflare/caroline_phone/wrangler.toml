name = "caroline-phone"
account_id = "882fc7501e4632c7c58879d5c1d5b672"
main = "src/index.ts"
compatibility_date = "2026-09-23"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[observability]
enabled = true

# Runtime secrets are configured in Cloudflare, never committed here:
# CAROLINE_KEY
# CORE_RUNTIME_KEY
# ELEVENLABS_WEBHOOK_SECRET
# ELEVENLABS_API_KEY
# TWILIO_AUTH_TOKEN
# OPEN_ROUTER_KEY

[vars]
ENVIRONMENT = "production"
ELEVENLABS_AGENT_ID = "agent_8001m2ba4rmder6t7wq270ntj43j"
PHONE_TOOL_POLICY_JSON = "{\"owner\":[],\"external\":[],\"unknown\":[],\"outbound\":[],\"hold\":[],\"calendar_read\":[],\"reentry\":[]}"

[exports.CarolineSession]
type = "durable-object"
storage = "sqlite"

[[durable_objects.bindings]]
name = "CAROLINE_SESSIONS"
class_name = "CarolineSession"

[[kv_namespaces]]
binding = "CAROLINE_PHONE"
id = "85679a0030e846ee931226aa1a6e6332"

[[r2_buckets]]
binding = "CAROLINE_EVENTS_RAW"
bucket_name = "caroline-events-raw"

[[r2_buckets]]
binding = "CAROLINE_TRANSCRIPTS"
bucket_name = "caroline-transcripts"

[[r2_buckets]]
binding = "CAROLINE_ARTIFACTS"
bucket_name = "caroline-artifacts"

[[r2_buckets]]
binding = "CAROLINE_MEDIA"
bucket_name = "caroline-media"

[[d1_databases]]
binding = "CAROLINE_DB"
database_name = "CAROLINE_DB"
database_id = "e350a176-c2be-4b5c-9975-bebb157e944a"

[[queues.producers]]
binding = "EVENT_DELIVERY"
queue = "caroline-event-delivery"

[[queues.consumers]]
queue = "caroline-event-delivery"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 3
