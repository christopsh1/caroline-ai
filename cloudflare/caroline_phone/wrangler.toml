name = "caroline_phone"
main = "src/index.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true

# Bind the live Cloudflare KV namespace named `Caroline_Phone` after its
# namespace ID is read from the Cloudflare API. Do not guess or reuse an old ID.
#
# [[kv_namespaces]]
# binding = "CAROLINE_PHONE"
# id = "<LIVE_CAROLINE_PHONE_KV_NAMESPACE_ID>"

# Worker secrets (never commit values):
#   CAROLINE_RUNTIME_KEY
#   ELEVENLABS_WEBHOOK_SECRET
#
# Optional downstream delivery, enabled only after a new backend contract is chosen:
#   EVENT_SINK_URL
#   EVENT_SINK_KEY
#
# Twilio ingress is intentionally disabled in v3 until its Cloudflare route is
# explicitly configured and validated with Twilio's official request validator.
